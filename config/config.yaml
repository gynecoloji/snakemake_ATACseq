# ATAC-seq analysis configuration

# Sample information table (columns: sample_id, type, group)
samples_table: "config/samples.csv"

# Adapter trimming: fastp AUTO-DETECTS adapters for paired-end reads by default
# (--detect_adapter_for_pe). To force specific adapters instead — which OVERRIDES
# auto-detection — uncomment adapter_r1/adapter_r2 below (Illumina defaults shown).
# adapter_r1: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA"
# adapter_r2: "AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT"

# ── Alignment: human reference ──────────────────────────────────────────
# Human genome FASTA (you provide; MUST be chr-prefixed UCSC to match the blacklist)
human_fasta: "ref/hg38.fa"
# Bowtie2 index for the human genome, built by build_genome_index
bowtie2_index: "ref/BOWTIE2/genome"
# Restrict the human genome to these chromosomes before building the index (reads
# then align only to these). Set to [] to keep ALL human chroms.
align_chroms: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrM]
# Analysis keep-set for the final BAM: mito-% QC is recorded first, then reads
# are restricted to these chroms (drop chrM/chrY/non-primary). MUST be a subset of
# align_chroms, and kept consistent with keep_chroms_regex (Module B consensus).
keep_chroms: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX]

# Blacklist regions file
blacklist: "ref/hg38_blacklist_regions.bed"

# Peak types to analyze (narrowPeak for standard ATAC-seq, add broadPeak if needed)
peak_types: ["narrowPeak"]

# deepTools bigWig settings (RPGC depth-normalized coverage)
effective_genome_size: 2913022398    # hg38 effective genome size (RPGC normalization)
bin_size: 25

# ── Module B: Consensus peaks & fragment counting ───────────────────────
consensus_window: 500                # fixed peak width around summit (bp)
consensus_min_replicates: 2          # majority-vote threshold (conditions with >=3 reps)
idr_threshold: 0.05                  # IDR threshold (conditions with exactly 2 reps)
idr_relaxed_pvalue: 0.1              # MACS2 -p for relaxed calls (IDR input)
idr_top_n_peaks: 150000              # top-N relaxed peaks retained for IDR
keep_chroms_regex: "^chr([1-9]|1[0-9]|2[0-2]|X)$"   # primary autosomes + chrX
macs2_genome: "hs"                   # MACS2 -g for relaxed calls

# ── QC pipeline (workflow/rules/qc.smk) ─────────────────────────────────
gtf: "ref/gencode.v36.annotation.gtf"          # for TSS enrichment (chr-prefixed GENCODE)
promoter_bed: "ref/promoter_chr1-22X.bed"       # reads-in-annotation QC
enhancer_bed: "ref/enhancer_chr1-22X.bed"

# ── Optional footprinting stage (workflow/rules/footprint.smk, footprint_all) ──
# JASPAR-format motif file for TOBIAS BINDetect. Only needed if you run the
# footprint_all target. Download the JASPAR CORE vertebrates PFMs into ref/ (see
# the README "Footprinting" section).
jaspar_motifs: "ref/JASPAR2024_CORE_vertebrates.jaspar"

# ── Optional differential-openness stage (workflow/rules/diffopen.smk, diffopen_all) ──
# Constitutive-CTCF anchor set used by the `ctcf` normalization mode. Built by
# workflow/scripts/build_constitutive_ctcf.py as the union of ENCODE CTCF ChIP-seq
# peaks across ~59 diverse cell types, keeping regions bound in >=90% of them
# (portable to any human sample). NOTE: do NOT point this at
# ref/GRCh38-cCREs.CTCF-only.bed — SCREEN's CA-CTCF class excludes CTCF sites at
# promoters/enhancers and is a poor normalization anchor.
ctcf_bed: "ref/constitutive_ctcf_hg38.bed"
# Which spike-in-free normalizations to run for `diffopen_all`. Each writes its
# own results/diffopen/<mode>/ directory so the modes can be compared:
#   none - DESeq2 median-of-ratios over all peaks (baseline)
#   ctcf - median-of-ratios restricted to CTCF anchors (spike-in free)
# Add "rnastable" (needs diffopen_rna_table) to also anchor on stable promoters.
diffopen_modes: ["none", "ctcf"]
diffopen_ref_label: "Control"        # reference level of the `type` column (contrast denominator)
# `ctcf` mode: iteratively drop anchors that actually MOVED between conditions
# (>|trim_k| MADs from the median shift) and re-estimate on the survivors.
ctcf_trim_k: 2.5                     # MAD multiplier; set very large to disable trimming
ctcf_trim_iter: 2                    # trim/re-estimate iterations (0 = no trimming)
# Downstream of the DA tables: gene assignment, GO enrichment, browser tracks
diffopen_min_genes: 10               # gate: sets with <= this many genes are skipped
diffopen_go_ont: "BP"                # GO ontology for clusterProfiler (BP/MF/CC)
diffopen_track_tier: "p01"           # which tier to draw Gviz tracks for
diffopen_track_top: 5                # top N up and N down regions per class
